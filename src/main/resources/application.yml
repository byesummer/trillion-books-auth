spring:
  application:
    name: auth-service

  config:
    import: configserver:${CONFIG_SERVER_URI:http://localhost:10418}
  cloud:
    config:
      username: config-user
      password: REDACTED_USE_ENV_VAR

server:
  port: ${SERVER_PORT}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL}
